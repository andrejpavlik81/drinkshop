<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jednoduché úlohy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Úlohy</h1>
      <nav class="tabs">
        <button id="tab-tasks" class="tab-button active">Úlohy</button>
        <button id="tab-stats" class="tab-button">Štatistiky</button>
      </nav>
    </header>

    <!-- Tasks section -->
    <section id="tasks-section">
      <form id="new-task-form" class="new-task-form" autocomplete="off">
        <input id="new-task-input" placeholder="Pridať novú úlohu..." />
        <input id="new-task-creator" placeholder="Kto zadal (voliteľné)" />
        <button type="submit">Pridať</button>
      </form>

      <div class="controls">
        <div class="filters">
          <button data-filter="all" class="active">Všetky</button>
          <button data-filter="active">Aktívne</button>
          <button data-filter="done">Hotové</button>
        </div>
        <div class="actions">
          <button id="clear-completed">Vymazať hotové</button>
        </div>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <footer class="footer">
        <span id="task-count">0 úloh</span>
      </footer>
    </section>

    <!-- Stats section -->
    <section id="stats-section" class="hidden">
      <div class="stats-header">
        <label for="stats-range">Zobraziť dni:</label>
        <select id="stats-range">
          <option value="7">Posledných 7 dní</option>
          <option value="14" selected>Posledných 14 dní</option>
          <option value="30">Posledných 30 dní</option>
          <option value="0">Všetky dni</option>
        </select>
        <button id="refresh-stats">Aktualizovať</button>
      </div>
      <div class="chart-wrap">
        <canvas id="completed-chart" width="800" height="300"></canvas>
      </div>
      <p class="stats-note">Graf zobrazuje počet úloh, ktoré boli označené ako hotové podľa dátumu vyriešenia (lokálny čas prehliadača).</p>
    </section>
  </main>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
